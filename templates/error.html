<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ status_code }} - {{ error_title }} - Erp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FFFBF9; padding:24px;">
  <div style="text-align:center; max-width:420px;">
    <div style="font-family:var(--mono); font-size:20px; font-weight:600; letter-spacing:.1em; color:var(--red); margin-bottom:14px;">
      ERROR {{ status_code }}
    </div>
    <h1 style="font-family:var(--disp); font-size:30px; font-weight:700; color:var(--ink); margin:0 0 10px; letter-spacing:-.01em;">
      {{ error_title }}
    </h1>
    <p style="color:var(--ink-2); font-size:15px; margin:0 0 30px; line-height:1.6;">
      {{ error_message }}
    </p>
    <a href="/dashboard" class="login-btn" style="display:inline-block; width:auto; padding:12px 32px; text-decoration:none; box-sizing:border-box;">
      Back to Dashboard
    </a>
  </div>
</div>

</body>
</html>
