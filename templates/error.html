<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ status_code }} - {{ error_title }} - Erp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="error-page">
  <div class="error-box">
    <div class="error-code">
      ERROR {{ status_code }}
    </div>
    <h1 class="error-title">
      {{ error_title }}
    </h1>
    <p class="error-message">
      {{ error_message }}
    </p>
    <a href="/dashboard" class="login-btn error-btn">
      Back to Dashboard
    </a>
  </div>
</div>

</body>
</html>
